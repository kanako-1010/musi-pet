<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>像素暮斯的電子小窩</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #fdf6e3;
      background-image: radial-gradient(#e8dcc5 2px, transparent 2px);
      background-size: 30px 30px;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 頂部狀態控制列 */
    .control-panel {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.94);
      padding: 15px 25px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      text-align: center;
      z-index: 100;
      width: 90%;
      max-width: 360px;
    }

    h1 { color: #5c4b51; margin: 0 0 8px 0; font-size: 20px; }
    
    .status-text {
      font-weight: bold;
      color: #6b9e93;
      margin-bottom: 10px;
      min-height: 22px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: #f5f5f5;
      padding: 8px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 14px;
      color: #555;
    }

    .buttons button {
      background-color: #f3b562;
      border: none;
      color: white;
      padding: 8px 14px;
      margin: 2px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s;
    }
    .buttons button:active { transform: scale(0.92); }

    /* 暮斯的移動容器 */
    #pet-container {
      position: absolute;
      left: 50%;
      top: 55%;
      width: 150px;
      height: 150px;
      transition: left 2.5s linear, top 2.5s linear;
      cursor: pointer;
      user-select: none;
      z-index: 10;
    }

    /* 像素圖銳利化呈現，保留復古像素質感 */
    #petImg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated; 
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.16));
      transform: scaleX(var(--dir, 1));
    }

    /* 靜止時的可愛微幅呼吸 */
    @keyframes idleBob {
      0%, 100% { transform: scaleX(var(--dir, 1)) translateY(0); }
      50% { transform: scaleX(var(--dir, 1)) translateY(-3px); }
    }

    .idle #petImg {
      animation: idleBob 1.5s infinite ease-in-out;
    }

    /* 睡覺時縮小一點並加上半透明濾鏡 */
    .sleeping #petImg {
      transform: scaleX(var(--dir, 1)) scaleY(0.88) translateY(10px);
      opacity: 0.85;
    }

    .pop-emoji {
      position: absolute;
      font-size: 24px;
      pointer-events: none;
      animation: floatUp 1s ease-out forwards;
      z-index: 50;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
    }
  </style>
</head>
<body>

  <div class="control-panel">
    <h1>🐾 暮斯的像素小窩</h1>
    <div id="statusMsg" class="status-text">暮斯正在四處散步探險...</div>
    <div class="stats">
      <div>飽足感：<span id="hunger">80</span>%</div>
      <div>心情值：<span id="happiness">80</span>%</div>
    </div>
    <div class="buttons">
      <button onclick="petAction('feed')">🍖 餵食</button>
      <button onclick="petAction('play')">🎾 丟球</button>
      <button onclick="petAction('sleep')">💤 睡覺</button>
    </div>
  </div>

  <!-- 像素暮斯本體 -->
  <div id="pet-container" class="idle" onclick="petAction('pet')">
    <img id="petImg" src="stand.png" alt="像素暮斯">
  </div>

<script>
  let hunger = 80;
  let happiness = 80;
  let isSleeping = false;
  let isBusy = false;
  let walkInterval = null;
  let walkFrame = 0;

  const petContainer = document.getElementById('pet-container');
  const petImg = document.getElementById('petImg');
  const statusMsg = document.getElementById('statusMsg');

  let currentX = window.innerWidth / 2 - 75;
  let currentY = window.innerHeight * 0.55;
  petContainer.style.left = currentX + 'px';
  petContainer.style.top = currentY + 'px';

  function updateDisplay() {
    document.getElementById('hunger').innerText = hunger;
    document.getElementById('happiness').innerText = happiness;
  }

  // 啟動四隻小腳快速交替的像素走路動畫
  function startWalkingAnimation(speedMultiplier = 1) {
    stopWalkingAnimation();
    petContainer.className = '';
    const frameSpeed = Math.max(110, 200 / speedMultiplier); // 跑越快腳動越快！
    
    walkInterval = setInterval(() => {
      walkFrame = (walkFrame + 1) % 2;
      petImg.src = walkFrame === 0 ? 'walk1.png' : 'walk2.png';
    }, frameSpeed);
  }

  function stopWalkingAnimation() {
    if (walkInterval) {
      clearInterval(walkInterval);
      walkInterval = null;
    }
  }

  function movePetTo(targetX, targetY, speedMultiplier = 1) {
    if (isSleeping) return;

    // 走路圖原圖面朝右：往右走為 1，往左走翻轉為 -1
    if (targetX < currentX) {
      petImg.style.setProperty('--dir', '-1');
    } else {
      petImg.style.setProperty('--dir', '1');
    }

    const dx = targetX - currentX;
    const dy = targetY - currentY;
    const distance = Math.sqrt(dx * dx + dy * dy);
    const duration = Math.max(0.8, (distance / 120) / speedMultiplier);

    petContainer.style.transition = `left ${duration}s linear, top ${duration}s linear`;
    startWalkingAnimation(speedMultiplier);

    currentX = targetX;
    currentY = targetY;
    petContainer.style.left = currentX + 'px';
    petContainer.style.top = currentY + 'px';

    setTimeout(() => {
      stopWalkingAnimation();
      if (!isSleeping && !isBusy) {
        petContainer.className = 'idle';
        petImg.src = 'stand.png';
        petImg.style.setProperty('--dir', '1'); // 站立時轉回正面眨眼
      }
    }, duration * 1000);
  }

  function autoWander() {
    if (!isSleeping && !isBusy) {
      const minX = 20;
      const maxX = window.innerWidth - 170;
      const minY = 200; 
      const maxY = window.innerHeight - 170;

      const randomX = Math.max(minX, Math.random() * maxX);
      const randomY = Math.max(minY, Math.random() * maxY);

      movePetTo(randomX, randomY, 1);
    }
    setTimeout(autoWander, 3500 + Math.random() * 2500);
  }

  // 點擊螢幕空白處呼喚暮斯跑過來
  document.body.addEventListener('click', (e) => {
    if (e.target.closest('.control-panel') || e.target.closest('#pet-container')) return;
    if (isSleeping) {
      statusMsg.innerText = '暮斯正在睡覺，叫不醒牠喔～';
      return;
    }

    const targetX = Math.min(window.innerWidth - 160, Math.max(10, e.clientX - 75));
    const targetY = Math.min(window.innerHeight - 160, Math.max(200, e.clientY - 75));
    
    spawnEmoji(e.clientX, e.clientY, '🐾');
    statusMsg.innerText = '暮斯邁開小短腿跑過來了！';
    movePetTo(targetX, targetY, 1.8);
  });

  function spawnEmoji(x, y, emoji) {
    const el = document.createElement('div');
    el.className = 'pop-emoji';
    el.innerText = emoji;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  function petAction(action) {
    if (action === 'sleep') {
      isSleeping = !isSleeping;
      stopWalkingAnimation();
      if (isSleeping) {
        petContainer.className = 'sleeping';
        petImg.src = 'stand.png';
        statusMsg.innerText = '暮斯趴下來打盹了... Zzz';
      } else {
        petContainer.className = 'idle';
        petImg.src = 'stand.png';
        statusMsg.innerText = '暮斯眨眨眼醒來了！';
      }
      return;
    }

    isSleeping = false;
    isBusy = true;
    stopWalkingAnimation();
    petContainer.className = 'idle';
    petImg.style.setProperty('--dir', '1');
    petImg.src = 'cheer.png'; // 切換成舉雙手冒愛心的歡呼圖！

    if (action === 'feed') {
      hunger = Math.min(100, hunger + 15);
      statusMsg.innerText = '暮斯舉起雙手開心吃飯！喵嗚～';
      spawnEmoji(currentX + 60, currentY, '🍖');
    } else if (action === 'play') {
      happiness = Math.min(100, happiness + 15);
      hunger = Math.max(0, hunger - 5);
      statusMsg.innerText = '暮斯超興奮地衝出去追球球！';
      spawnEmoji(currentX + 60, currentY, '🎾');
      const rushX = Math.max(20, Math.random() * (window.innerWidth - 170));
      const rushY = Math.max(200, Math.random() * (window.innerHeight - 170));
      movePetTo(rushX, rushY, 2.2);
    } else if (action === 'pet') {
      happiness = Math.min(100, happiness + 5);
      statusMsg.innerText = '你摸了摸暮斯，牠開心地冒出愛心！';
      spawnEmoji(currentX + 60, currentY, '❤️');
    }

    updateDisplay();

    setTimeout(() => {
      if (!isSleeping) {
        petImg.src = 'stand.png';
        statusMsg.innerText = '暮斯正在四處散步探險...';
      }
      isBusy = false;
    }, 2500);
  }

  setInterval(() => {
    if (isSleeping) {
      happiness = Math.min(100, happiness + 1);
    } else {
      hunger = Math.max(0, hunger - 2);
      happiness = Math.max(0, happiness - 2);
      if (hunger < 30 && !isBusy) {
        statusMsg.innerText = '暮斯肚子餓了，快餵牠！';
      }
    }
    updateDisplay();
  }, 5000);

  setTimeout(autoWander, 1000);
</script>

</body>
</html>
