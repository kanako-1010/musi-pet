<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暮斯的散步小窩</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #fdf6e3;
      background-image: radial-gradient(#e8dcc5 2px, transparent 2px);
      background-size: 30px 30px;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 頂部狀態控制列 */
    .control-panel {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.92);
      padding: 15px 25px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      text-align: center;
      z-index: 100;
      width: 90%;
      max-width: 360px;
    }

    h1 { color: #5c4b51; margin: 0 0 8px 0; font-size: 20px; }
    
    .status-text {
      font-weight: bold;
      color: #6b9e93;
      margin-bottom: 10px;
      min-height: 22px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: #f5f5f5;
      padding: 8px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 14px;
      color: #555;
    }

    .buttons button {
      background-color: #f3b562;
      border: none;
      color: white;
      padding: 8px 14px;
      margin: 2px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s;
    }
    .buttons button:active { transform: scale(0.92); }

    /* 暮斯的移動容器 */
    #pet-container {
      position: absolute;
      left: 50%;
      top: 55%;
      width: 170px;
      height: 170px;
      transition: left 2.5s linear, top 2.5s linear;
      cursor: pointer;
      user-select: none;
      z-index: 10;
    }

    /* 暮斯本體圖片 */
    #petImg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,0.18));
      transition: transform 0.2s;
    }

    /* 走路時的上下彈跳動畫 */
    @keyframes waddle {
      0%, 100% { transform: translateY(0) scaleX(var(--dir, 1)); }
      50% { transform: translateY(-15px) scaleX(var(--dir, 1)); }
    }

    .walking #petImg {
      animation: waddle 0.4s infinite ease-in-out;
    }

    /* 靜止時的微幅呼吸動畫 */
    @keyframes breathe {
      0%, 100% { transform: scale(1) scaleX(var(--dir, 1)); }
      50% { transform: scale(1.04) scaleX(var(--dir, 1)); }
    }

    .idle #petImg {
      animation: breathe 2s infinite ease-in-out;
    }

    /* 點擊螢幕時出現的小愛心或飼料特效 */
    .pop-emoji {
      position: absolute;
      font-size: 24px;
      pointer-events: none;
      animation: floatUp 1s ease-out forwards;
      z-index: 50;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
    }
  </style>
</head>
<body>

  <!-- 頂部面板 -->
  <div class="control-panel">
    <h1>🐾 暮斯的散步小窩</h1>
    <div id="statusMsg" class="status-text">暮斯正在四處探險...</div>
    <div class="stats">
      <div>飽足感：<span id="hunger">80</span>%</div>
      <div>心情值：<span id="happiness">80</span>%</div>
    </div>
    <div class="buttons">
      <button onclick="petAction('feed')">🍖 餵食</button>
      <button onclick="petAction('play')">🎾 丟球</button>
      <button onclick="petAction('sleep')">💤 睡覺</button>
    </div>
  </div>

  <!-- 會跑來跑去的暮斯 -->
  <div id="pet-container" class="idle" onclick="petAction('pet')">
    <img id="petImg" src="normal.png" alt="暮斯">
  </div>

<script>
  const normalPhotos = ['normal.png', 'normal2.png', 'LOOK.png', 'LOOK4.png'];
  const happyPhotos = ['HAPPY.png', 'MEOW.png'];
  const sleepPhotos = ['SLEEP.png', 'SLEEP2.png', 'SLEEP3.png', 'LAZY.png'];

  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  let hunger = 80;
  let happiness = 80;
  let isSleeping = false;
  let isBusy = false;

  const petContainer = document.getElementById('pet-container');
  const petImg = document.getElementById('petImg');
  const statusMsg = document.getElementById('statusMsg');

  let currentX = window.innerWidth / 2 - 85;
  let currentY = window.innerHeight * 0.55;
  petContainer.style.left = currentX + 'px';
  petContainer.style.top = currentY + 'px';

  function updateDisplay() {
    document.getElementById('hunger').innerText = hunger;
    document.getElementById('happiness').innerText = happiness;
  }

  function movePetTo(targetX, targetY, speedMultiplier = 1) {
    if (isSleeping) return;

    petImg.src = pickRandom(['normal.png', 'LOOK.png', 'LOOK4.png']);

    if (targetX < currentX) {
      petImg.style.setProperty('--dir', '-1');
    } else {
      petImg.style.setProperty('--dir', '1');
    }

    const dx = targetX - currentX;
    const dy = targetY - currentY;
    const distance = Math.sqrt(dx * dx + dy * dy);
    const duration = Math.max(0.8, (distance / 120) / speedMultiplier);

    petContainer.style.transition = `left ${duration}s linear, top ${duration}s linear`;
    petContainer.classList.remove('idle');
    petContainer.classList.add('walking');

    currentX = targetX;
    currentY = targetY;
    petContainer.style.left = currentX + 'px';
    petContainer.style.top = currentY + 'px';

    setTimeout(() => {
      petContainer.classList.remove('walking');
      if (!isSleeping) {
        petContainer.classList.add('idle');
        petImg.src = pickRandom(normalPhotos);
      }
    }, duration * 1000);
  }

  function autoWander() {
    if (!isSleeping && !isBusy) {
      const minX = 20;
      const maxX = window.innerWidth - 190;
      const minY = 210; 
      const maxY = window.innerHeight - 190;

      const randomX = Math.max(minX, Math.random() * maxX);
      const randomY = Math.max(minY, Math.random() * maxY);

      movePetTo(randomX, randomY, 1);
    }
    setTimeout(autoWander, 3500 + Math.random() * 2500);
  }

  document.body.addEventListener('click', (e) => {
    if (e.target.closest('.control-panel') || e.target.closest('#pet-container')) return;
    if (isSleeping) {
      statusMsg.innerText = '暮斯正在呼呼大睡，叫不醒牠喔～';
      return;
    }

    const targetX = Math.min(window.innerWidth - 180, Math.max(10, e.clientX - 85));
    const targetY = Math.min(window.innerHeight - 180, Math.max(200, e.clientY - 85));
    
    spawnEmoji(e.clientX, e.clientY, '🐾');
    statusMsg.innerText = '暮斯聽到呼喚跑過來了！';
    movePetTo(targetX, targetY, 1.8);
  });

  function spawnEmoji(x, y, emoji) {
    const el = document.createElement('div');
    el.className = 'pop-emoji';
    el.innerText = emoji;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  function petAction(action) {
    if (action === 'sleep') {
      isSleeping = !isSleeping;
      if (isSleeping) {
        petContainer.classList.remove('walking', 'idle');
        petImg.src = pickRandom(sleepPhotos);
        statusMsg.innerText = '暮斯找了個舒服姿勢睡著了... Zzz';
      } else {
        petImg.src = pickRandom(normalPhotos);
        petContainer.classList.add('idle');
        statusMsg.innerText = '暮斯伸了個大懶腰醒來了！';
      }
      return;
    }

    isSleeping = false;
    isBusy = true;
    petContainer.classList.remove('walking');
    petContainer.classList.add('idle');

    if (action === 'feed') {
      hunger = Math.min(100, hunger + 15);
      petImg.src = 'MEOW.png';
      statusMsg.innerText = '暮斯張大嘴巴大口吃飯！喵嗚～';
      spawnEmoji(currentX + 70, currentY, '🍖');
    } else if (action === 'play') {
      happiness = Math.min(100, happiness + 15);
      hunger = Math.max(0, hunger - 5);
      petImg.src = 'HAPPY.png';
      statusMsg.innerText = '你丟出球球，暮斯興奮地衝過去！';
      spawnEmoji(currentX + 70, currentY, '🎾');
      const rushX = Math.max(20, Math.random() * (window.innerWidth - 190));
      const rushY = Math.max(210, Math.random() * (window.innerHeight - 190));
      movePetTo(rushX, rushY, 2.2);
    } else if (action === 'pet') {
      happiness = Math.min(100, happiness + 5);
      petImg.src = pickRandom(happyPhotos);
      statusMsg.innerText = '你摸了摸暮斯，牠開心地翻肚肚！';
      spawnEmoji(currentX + 70, currentY, '❤️');
    }

    updateDisplay();

    setTimeout(() => {
      if (!isSleeping) {
        petImg.src = pickRandom(normalPhotos);
        statusMsg.innerText = '暮斯正在四處探險...';
      }
      isBusy = false;
    }, 2500);
  }

  setInterval(() => {
    if (isSleeping) {
      happiness = Math.min(100, happiness + 1);
    } else {
      hunger = Math.max(0, hunger - 2);
      happiness = Math.max(0, happiness - 2);
      if (hunger < 30 && !isBusy) {
        petImg.src = 'LAZY.png';
        statusMsg.innerText = '暮斯餓到趴在地上不動了，快餵牠！';
      }
    }
    updateDisplay();
  }, 5000);

  setTimeout(autoWander, 1000);
</script>

</body>
</html>
