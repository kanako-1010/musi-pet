<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暮斯的骨骼機器人小窩</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #fdf6e3;
      background-image: radial-gradient(#e8dcc5 2px, transparent 2px);
      background-size: 30px 30px;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .control-panel {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.92);
      padding: 15px 25px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      text-align: center;
      z-index: 100;
      width: 90%;
      max-width: 360px;
    }

    h1 { color: #5c4b51; margin: 0 0 8px 0; font-size: 20px; }
    
    .status-text {
      font-weight: bold;
      color: #6b9e93;
      margin-bottom: 10px;
      min-height: 22px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: #f5f5f5;
      padding: 8px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 14px;
      color: #555;
    }

    .buttons button {
      background-color: #f3b562;
      border: none;
      color: white;
      padding: 8px 14px;
      margin: 2px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s;
    }
    .buttons button:active { transform: scale(0.92); }

    /* 暮斯的整體移動與轉向容器 */
    #pet-container {
      position: absolute;
      left: 50%;
      top: 55%;
      width: 240px;
      height: 240px;
      transition: left 2.5s linear, top 2.5s linear;
      cursor: pointer;
      user-select: none;
      z-index: 10;
    }

    #pet-flipper {
      width: 100%;
      height: 100%;
      position: relative;
      transform: scaleX(var(--dir, 1));
      transition: transform 0.2s;
    }

    /* 2D 骨骼機器人零件設定 */
    .rig-part {
      position: absolute;
      object-fit: contain;
      pointer-events: none;
    }

    /* 針對黑底零件加上 darken/multiply 消除黑框的臨時魔法 */
    .black-bg-fix {
      mix-blend-mode: darken; 
    }

    /* 1. 身體（原圖面朝右） */
    .part-body {
      width: 125px;
      left: 55px;
      top: 65px;
      z-index: 2;
    }

    /* 2. 頭部（接在身體右上方） */
    .part-head {
      width: 105px;
      left: 85px;
      top: 10px;
      z-index: 4;
      transform-origin: 40% 85%;
      border-radius: 50%;
    }

    /* 3. 前腳（接在身體下方偏右） */
    .part-leg-front {
      width: 65px;
      left: 110px;
      top: 145px;
      z-index: 3;
      transform-origin: 20% 30%;
    }

    /* 4. 後腳（接在身體下方偏左） */
    .part-leg-back {
      width: 65px;
      left: 65px;
      top: 150px;
      z-index: 1;
      transform-origin: 20% 50%;
    }

    /* 5. 尾巴（原圖朝右，翻轉朝左接在屁股後面） */
    .part-tail {
      width: 80px;
      left: 5px;
      top: 125px;
      z-index: 1;
      transform-origin: 85% 50%;
    }

    #fallback-img {
      width: 170px;
      height: 170px;
      object-fit: contain;
      display: none;
    }

    /* --- 走路時的骨骼連動動畫 --- */
    .walking #pet-flipper { animation: bodyBounce 0.35s infinite alternate ease-in-out; }
    .walking .part-head { animation: headNod 0.35s infinite alternate ease-in-out; }
    .walking .part-leg-front { animation: walkSwingA 0.35s infinite alternate ease-in-out; }
    .walking .part-leg-back { animation: walkSwingB 0.35s infinite alternate ease-in-out; }
    .walking .part-tail { animation: tailWag 0.25s infinite alternate ease-in-out; }

    /* --- 靜止呼吸時的骨骼微動 --- */
    .idle .part-head { animation: headIdle 1.8s infinite alternate ease-in-out; }
    .idle .part-tail { animation: tailWag 0.9s infinite alternate ease-in-out; }

    /* --- 開心/互動時的歡呼動作 --- */
    .excited .part-head { animation: headExcited 0.25s infinite alternate ease-in-out; }
    .excited .part-leg-front { animation: pawWave 0.25s infinite alternate ease-in-out; }
    .excited .part-tail { animation: tailWag 0.15s infinite alternate ease-in-out; }

    @keyframes bodyBounce { 0% { transform: scaleX(var(--dir, 1)) translateY(0px); } 100% { transform: scaleX(var(--dir, 1)) translateY(-8px); } }
    @keyframes headNod { 0% { transform: rotate(-6deg); } 100% { transform: rotate(8deg); } }
    @keyframes headIdle { 0% { transform: rotate(-3deg); } 100% { transform: rotate(4deg); } }
    @keyframes headExcited { 0% { transform: rotate(-12deg) translateY(-3px); } 100% { transform: rotate(12deg) translateY(0px); } }
    @keyframes walkSwingA { 0% { transform: rotate(-25deg); } 100% { transform: rotate(25deg); } }
    @keyframes walkSwingB { 0% { transform: rotate(25deg); } 100% { transform: rotate(-25deg); } }
    @keyframes pawWave { 0% { transform: rotate(-10deg); } 100% { transform: rotate(-55deg); } }
    @keyframes tailWag { 0% { transform: scaleX(-1) rotate(-15deg); } 100% { transform: scaleX(-1) rotate(20deg); } }

    .pop-emoji {
      position: absolute;
      font-size: 24px;
      pointer-events: none;
      animation: floatUp 1s ease-out forwards;
      z-index: 50;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
    }
  </style>
</head>
<body>

  <div class="control-panel">
    <h1>🐾 暮斯的骨骼機器人小窩</h1>
    <div id="statusMsg" class="status-text">暮斯骨骼機器人啟動完成！</div>
    <div class="stats">
      <div>飽足感：<span id="hunger">80</span>%</div>
      <div>心情值：<span id="happiness">80</span>%</div>
    </div>
    <div class="buttons">
      <button onclick="petAction('feed')">🍖 餵食</button>
      <button onclick="petAction('play')">🎾 丟球</button>
      <button onclick="petAction('sleep')">💤 睡覺</button>
    </div>
  </div>

  <!-- 暮斯骨骼容器 -->
  <div id="pet-container" class="idle" onclick="petAction('pet')">
    <div id="pet-flipper">
      <div id="rig-parts">
        <img class="rig-part part-tail black-bg-fix" src="tail.png" onerror="switchToFallback()">
        <img class="rig-part part-leg-back black-bg-fix" src="leg_back.png" onerror="switchToFallback()">
        <img class="rig-part part-body black-bg-fix" src="body.png" onerror="switchToFallback()">
        <img class="rig-part part-leg-front black-bg-fix" src="leg_front.png" onerror="switchToFallback()">
        <img class="rig-part part-head" src="head.png" onerror="switchToFallback()">
      </div>
      <img id="fallback-img" src="LOOK.png" alt="暮斯">
    </div>
  </div>

<script>
  let hunger = 80;
  let happiness = 80;
  let isSleeping = false;
  let isBusy = false;
  let useFallback = false;

  const petContainer = document.getElementById('pet-container');
  const petFlipper = document.getElementById('pet-flipper');
  const fallbackImg = document.getElementById('fallback-img');
  const statusMsg = document.getElementById('statusMsg');

  function switchToFallback() {
    if (useFallback) return;
    useFallback = true;
    document.getElementById('rig-parts').style.display = 'none';
    fallbackImg.style.display = 'block';
    statusMsg.innerText = '找不到部分零件圖（請確認檔名為 leg_front.png）';
  }

  let currentX = window.innerWidth / 2 - 120;
  let currentY = window.innerHeight * 0.50;
  petContainer.style.left = currentX + 'px';
  petContainer.style.top = currentY + 'px';

  function updateDisplay() {
    document.getElementById('hunger').innerText = hunger;
    document.getElementById('happiness').innerText = happiness;
  }

  function movePetTo(targetX, targetY, speedMultiplier = 1) {
    if (isSleeping) return;

    // 身體原圖朝右，往右走為 1，往左走翻轉為 -1
    if (targetX < currentX) {
      petFlipper.style.setProperty('--dir', '-1');
    } else {
      petFlipper.style.setProperty('--dir', '1');
    }

    const dx = targetX - currentX;
    const dy = targetY - currentY;
    const distance = Math.sqrt(dx * dx + dy * dy);
    const duration = Math.max(0.8, (distance / 120) / speedMultiplier);

    petContainer.style.transition = `left ${duration}s linear, top ${duration}s linear`;
    petContainer.className = 'walking';

    currentX = targetX;
    currentY = targetY;
    petContainer.style.left = currentX + 'px';
    petContainer.style.top = currentY + 'px';

    setTimeout(() => {
      if (!isSleeping && !isBusy) {
        petContainer.className = 'idle';
      }
    }, duration * 1000);
  }

  function autoWander() {
    if (!isSleeping && !isBusy) {
      const minX = 10;
      const maxX = window.innerWidth - 240;
      const minY = 200; 
      const maxY = window.innerHeight - 240;

      const randomX = Math.max(minX, Math.random() * maxX);
      const randomY = Math.max(minY, Math.random() * maxY);

      movePetTo(randomX, randomY, 1);
    }
    setTimeout(autoWander, 3500 + Math.random() * 2500);
  }

  document.body.addEventListener('click', (e) => {
    if (e.target.closest('.control-panel') || e.target.closest('#pet-container')) return;
    if (isSleeping) {
      statusMsg.innerText = '暮斯正在睡覺，叫不醒牠喔～';
      return;
    }

    const targetX = Math.min(window.innerWidth - 240, Math.max(10, e.clientX - 120));
    const targetY = Math.min(window.innerHeight - 240, Math.max(200, e.clientY - 120));
    
    spawnEmoji(e.clientX, e.clientY, '🐾');
    statusMsg.innerText = '暮斯邁開小短腿跑過來了！';
    movePetTo(targetX, targetY, 1.8);
  });

  function spawnEmoji(x, y, emoji) {
    const el = document.createElement('div');
    el.className = 'pop-emoji';
    el.innerText = emoji;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  function petAction(action) {
    if (action === 'sleep') {
      isSleeping = !isSleeping;
      if (isSleeping) {
        petContainer.className = '';
        statusMsg.innerText = '暮斯進入休眠模式... Zzz';
      } else {
        petContainer.className = 'idle';
        statusMsg.innerText = '暮斯伸了個大懶腰醒來了！';
      }
      return;
    }

    isSleeping = false;
    isBusy = true;
    petContainer.className = 'excited';

    if (action === 'feed') {
      hunger = Math.min(100, hunger + 15);
      statusMsg.innerText = '暮斯開心地點頭大口吃飯！';
      spawnEmoji(currentX + 100, currentY, '🍖');
    } else if (action === 'play') {
      happiness = Math.min(100, happiness + 15);
      hunger = Math.max(0, hunger - 5);
      statusMsg.innerText = '暮斯撒腿狂奔去追球球！';
      spawnEmoji(currentX + 100, currentY, '🎾');
      const rushX = Math.max(10, Math.random() * (window.innerWidth - 240));
      const rushY = Math.max(200, Math.random() * (window.innerHeight - 240));
      movePetTo(rushX, rushY, 2.2);
    } else if (action === 'pet') {
      happiness = Math.min(100, happiness + 5);
      statusMsg.innerText = '你摸了摸暮斯，牠開心地揮起前爪！';
      spawnEmoji(currentX + 100, currentY, '❤️');
    }

    updateDisplay();

    setTimeout(() => {
      if (!isSleeping) {
        petContainer.className = 'idle';
        statusMsg.innerText = '暮斯正在四處巡邏...';
      }
      isBusy = false;
    }, 2500);
  }

  setInterval(() => {
    if (isSleeping) {
      happiness = Math.min(100, happiness + 1);
    } else {
      hunger = Math.max(0, hunger - 2);
      happiness = Math.max(0, happiness - 2);
      if (hunger < 30 && !isBusy) {
        statusMsg.innerText = '暮斯肚子餓了，快餵牠！';
      }
    }
    updateDisplay();
  }, 5000);

  setTimeout(autoWander, 1000);
</script>

</body>
</html>
