<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>暮斯 (Mousse) 的溫馨桌面小窩 - 點陣版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'DotGothic16', 'Noto Sans TC', monospace, sans-serif;
      background-color: #f9eedc;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .pixel-box {
      border: 3px solid #4a2c18;
      box-shadow: 0 4px 0 #4a2c18;
    }
    .pixel-btn {
      border: 2px solid #4a2c18;
      box-shadow: 0 3px 0 #4a2c18;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .pixel-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #4a2c18;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.9); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-48px) scale(1.15); opacity: 0; }
    }
    .animate-float-up {
      animation: floatUp 1.3s steps(8) forwards;
    }
    .nice-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .nice-scroll::-webkit-scrollbar-thumb {
      background: #c88a4b;
      border-radius: 4px;
    }
  </style>
</head>
<body class="flex flex-col justify-between relative text-[#3d2210]">

  <!-- ==================== 1. TOP PIXEL HUD ==================== -->
  <header class="relative z-20 px-2 pt-2 sm:px-4 sm:pt-3 pointer-events-none">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-2">

      <!-- Left: Mousse Info & 5 Pixel Gauges -->
      <div class="pointer-events-auto bg-[#fffaf0]/95 px-3 py-2 rounded-2xl pixel-box flex items-center gap-2.5 sm:gap-3.5 max-w-full">
        <!-- Mini Pixel Icon -->
        <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-[#f5c77e] border-2 border-[#4a2c18] flex items-center justify-center shrink-0 text-2xl shadow-inner">
          🐱
        </div>

        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-1.5">
            <span class="font-bold text-sm sm:text-base tracking-wide">暮斯 (Mousse)</span>
            <span class="text-[10px] sm:text-xs px-2 py-0.5 rounded-lg bg-[#fde6bd] border border-[#8c5228] font-bold">10個月 英國長毛公貓</span>
            <span id="hud-gift-count" class="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-[#ffedd5] border border-[#c2410c] text-[#9a3412]">🎁 0/12</span>
          </div>

          <!-- 5 Status Bars -->
          <div class="grid grid-cols-3 sm:flex sm:items-center gap-x-2.5 gap-y-1 mt-1.5 text-[11px] font-bold">
            <div class="flex items-center gap-1" title="飽足感">
              <span>🍖</span>
              <div class="w-11 sm:w-14 h-2.5 bg-[#ead5b7] border border-[#4a2c18] overflow-hidden">
                <div id="bar-hunger" class="h-full bg-[#f59e0b]" style="width: 75%"></div>
              </div>
              <span id="txt-hunger" class="text-[10px] w-7">75%</span>
            </div>

            <div class="flex items-center gap-1" title="水分">
              <span>💧</span>
              <div class="w-11 sm:w-14 h-2.5 bg-[#dbeafe] border border-[#4a2c18] overflow-hidden">
                <div id="bar-water" class="h-full bg-[#0284c7]" style="width: 80%"></div>
              </div>
              <span id="txt-water" class="text-[10px] w-7">80%</span>
            </div>

            <div class="flex items-center gap-1" title="心情">
              <span>💕</span>
              <div class="w-11 sm:w-14 h-2.5 bg-[#ffe4e6] border border-[#4a2c18] overflow-hidden">
                <div id="bar-mood" class="h-full bg-[#e11d48]" style="width: 90%"></div>
              </div>
              <span id="txt-mood" class="text-[10px] w-7">90%</span>
            </div>

            <div class="flex items-center gap-1" title="體力">
              <span>⚡</span>
              <div class="w-11 sm:w-14 h-2.5 bg-[#e0e7ff] border border-[#4a2c18] overflow-hidden">
                <div id="bar-energy" class="h-full bg-[#4f46e5]" style="width: 85%"></div>
              </div>
              <span id="txt-energy" class="text-[10px] w-7">85%</span>
            </div>

            <div class="flex items-center gap-1" title="便意（滿格會自己去砂盆）">
              <span>💩</span>
              <div class="w-11 sm:w-14 h-2.5 bg-[#fef3c7] border border-[#4a2c18] overflow-hidden">

              </div>

          </div>
        </div>

      <!-- Right: Litter Status + Sound + Reset -->
      <div class="pointer-events-auto flex items-center gap-1.5 sm:gap-2">
        <button onclick="scoopLitterBox()" id="hud-litter-pill" class="pixel-btn bg-[#ecfdf5] hover:bg-[#d1fae5] px-2.5 py-1.5 rounded-xl text-xs font-bold text-[#065f46] flex items-center gap-1" title="點擊鏟屎">

      <div class="flex items-center justify-between pb-2.5 border-b-2 border-[#e6c297] shrink-0">

  <!-- ==================== 5. PIXEL SPRITE ENGINE & GAME LOGIC ==================== -->
  <script>
    /**
     * ============================================================================
     * A. WEB AUDIO SYNTHESIZER (RETRO PIXEL MEOWS, PURRS, CRUNCHES & MELODY)
     * ============================================================================
     */
    let audioCtx = null;
    let soundOn = true;

    function initAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }

    function toggleSound() {
      soundOn = !soundOn;
      document.getElementById('icon-sound').textContent = soundOn ? '🔊' : '🔇';
      document.getElementById('lbl-sound').textContent = soundOn ? '音效開' : '靜音';
      if (soundOn) {
        initAudio();
        playMeow(540, 0.22, 0.12);
      }
    }

    function playMeow(baseFreq = 520, duration = 0.32, volume = 0.12) {
      if (!soundOn) return;
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(baseFreq * 0.85, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.32, now + duration * 0.32);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.72, now + duration);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      } catch (e) {}
    }

    function playPurr(duration = 0.8) {
      if (!soundOn) return;
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(28, now);
        lfo.type = 'sine';
        lfo.frequency.setValueAtTime(26, now);
        lfoGain.gain.setValueAtTime(0.045, now);
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(160, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.09, now + 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        lfo.connect(lfoGain);
        lfoGain.connect(gain.gain);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        lfo.start(now);
        osc.stop(now + duration + 0.02);
        lfo.stop(now + duration + 0.02);
      } catch (e) {}
    }

    function playCrunch(isDrink = false) {
      if (!soundOn) return;
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = isDrink ? 'sine' : 'square';
        osc.frequency.setValueAtTime(isDrink ? 620 : 300 + Math.random() * 140, now);
        osc.frequency.exponentialRampToValueAtTime(isDrink ? 960 : 150, now + 0.07);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      } catch (e) {}
    }

    function playDigNoise() {
      if (!soundOn) return;
      try {
        initAudio();
        const len = Math.floor(audioCtx.sampleRate * 0.1);
        const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.45));
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1800;
        const gain = audioCtx.createGain();
        gain.gain.value = 0.08;
        src.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        src.start();
      } catch (e) {}
    }

    function playBounce(intensity = 0.6) {
      if (!soundOn) return;
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(200 + intensity * 180, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.09);
        gain.gain.setValueAtTime(0.07 * intensity, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.11);
      } catch (e) {}
    }

    function playChime() {
      if (!soundOn) return;
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
        setTimeout(() => {
          try {
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
          } catch (e) {}
        }, idx * 80);
      });
    }

    function getFloorLineY() { return Math.round(stageH * 0.56); }

      return {
        food: { x: leftX, y: fy + 64 },

    function resizeStage() {
      const stageEl = document.getElementById('room-stage');
      const rect = stageEl.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      stageW = Math.max(320, rect.width);
      stageH = Math.max(320, rect.height);
      canvas.width = Math.floor(stageW * dpr);
      canvas.height = Math.floor(stageH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = false;

      const minY = getFloorLineY() + 26;
      const maxY = stageH - 36;
      if (mousse.y < minY || mousse.y > maxY) {
        mousse.y = Math.min(maxY, Math.max(minY, getFloorLineY() + 46));
      }
      mousse.x = Math.min(stageW - 60, Math.max(60, mousse.x));
    }

    function throwBallTo(tx, ty) {
      if (mousse.mode === 'walking_out' || mousse.mode === 'away') {
        setSpeech('暮斯正在外面散步，回來再陪你玩球球！', 2.5);
        return;
      }
      if (karaoke.active) stopKaraoke();
      initAudio();

      const minY = getFloorLineY() + 26;
      const maxY = stageH - 36;
      const clampedY = Math.min(maxY, Math.max(minY, ty));
      const clampedX = Math.min(stageW - 44, Math.max(44, tx));

      ball.active = true;
      ball.x = stageW * 0.5;
      ball.y = stageH - 25;
      ball.z = 36;
      ball.vx = (clampedX - ball.x) * 1.65;
      ball.vy = (clampedY - ball.y) * 1.65;
      ball.vz = 260;
      ball.spin = 0;

      mousse.carryingBall = false;
      mousse.mode = 'chasing';
      mousse.happyEyes = 0;
      refreshHudUI();
      setSpeech('毛線球飛出來啦！看暮斯甩著蓬鬆尾巴衝去撿！🧶', 2.5);
    }

      refreshHudUI();
      setSpeech('戴上小牽繩出門散步去！幫你帶紀念品回來喵 🐾', 3);
      playMeow(560, 0.25, 0.12);
    }

    function recallFromWalk() {
      if (mousse.mode !== 'away') return;
      walkAdventure.remaining = 0;
      completeWalkReturn();
    }

    function completeWalkReturn() {
      document.getElementById('walk-banner').classList.add('hidden');
      const unowned = SOUVENIR_CATALOG.filter(g => !state.unlockedGifts.includes(g.id));
      const pool = unowned.length > 0 ? unowned : SOUVENIR_CATALOG;
      const picked = pool[Math.floor(Math.random() * pool.length)];

      if (!state.unlockedGifts.includes(picked.id)) state.unlockedGifts.push(picked.id);
      state.hasNewGift = true;
      state.mood = Math.min(100, state.mood + 12);
      state.energy = Math.max(15, state.energy - 10);
      saveData();

      mousse.x = stageW + 70;
      mousse.y = getFloorLineY() + 46;
      mousse.targetX = stageW * 0.5;
      mousse.targetY = getFloorLineY() + 46;
      mousse.carryingGift = picked;
      mousse.mode = 'returning_gift';
      refreshHudUI();
    }

    function openGiftModal() {
      state.hasNewGift = false;
      refreshHudUI();
      const grid = document.getElementById('gift-grid');
      while (grid.firstChild) grid.removeChild(grid.firstChild);

      SOUVENIR_CATALOG.forEach(item => {
        const owned = state.unlockedGifts.includes(item.id);
        const card = document.createElement('div');
        card.className = owned
          ? 'p-2 rounded-xl bg-white border-2 border-[#4a2c18] flex flex-col items-center text-center'
          : 'p-2 rounded-xl bg-[#f3e3ca] border-2 border-[#a87c51] flex flex-col items-center text-center opacity-55';

        const iconEl = document.createElement('div');
        iconEl.className = 'text-2xl sm:text-3xl mb-1';
        iconEl.textContent = owned ? item.icon : '❓';

        const nameEl = document.createElement('div');
        nameEl.className = 'text-xs font-bold';
        nameEl.textContent = owned ? item.name : '未解鎖禮物';

        const descEl = document.createElement('div');
        descEl.className = 'text-[10px] text-[#78350f] mt-0.5 leading-tight';
        descEl.textContent = owned ? item.desc : '帶暮斯出門散步有機會帶回來喔！';

        card.appendChild(iconEl);
        card.appendChild(nameEl);
        card.appendChild(descEl);
        grid.appendChild(card);
      });

      document.getElementById('modal-gifts').classList.remove('hidden');
    }
    function closeGiftModal() { document.getElementById('modal-gifts').classList.add('hidden'); }

    /**
     * ============================================================================
     * F. POINTER INTERACTIONS
     * ============================================================================
     */
    let isDraggingPet = false;
    let lastPetSoundTime = 0;

    function isHitMousse(px, py) {
      if (mousse.mode === 'away') return false;
      if (spritesReady) {
        const { w, h } = currentSpriteInfo();
        return Math.abs(px - mousse.x) < w * 0.5 + 10 && py < mousse.y + 22 && py > mousse.y + 12 - h - 10;
      }
      const centerY = mousse.mode === 'sleeping' ? mousse.y - 24 : mousse.y - 64;
      return Math.hypot(px - mousse.x, py - centerY) < 88;
    }

    function petMousseAt(px, py) {
      const now = performance.now();
      if (now - lastPetSoundTime > 520) {
        lastPetSoundTime = now;
        playPurr(0.75);
        spawnFloatingEmoji('❤️', px - 10, py - 24);
        state.mood = Math.min(100, state.mood + 2);
        refreshHudUI();
      }
      mousse.happyEyes = 1;
      if (mousse.mode === 'idle') {
        mousse.mode = 'cheer';
        mousse.timer = 1.6;
        setSpeech('呼嚕嚕～摸摸頭好開心，舉高雙手露肉球！❤️', 2.4);
      } else if (mousse.mode === 'cheer') {
        mousse.timer = 1.6;
      } else if (mousse.mode === 'sleeping') {
        setSpeech('呼嚕嚕…睡夢中被摸摸頭好幸福 💤❤️', 2.4);
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;
      isDraggingPet = true;

      const props = getPropsCoords();
      if (Math.hypot(px - props.food.x, py - props.food.y) < 42) { openFeedModal(); return; }
      if (Math.hypot(px - props.water.x, py - (props.water.y - 16)) < 42) { refillWater(); return; }
      if (Math.hypot(px - props.litter.x, py - (props.litter.y - 14)) < 64) { scoopLitterBox(); return; }

      if (isHitMousse(px, py)) {
        petMousseAt(px, py);
      } else if (py > getFloorLineY() + 10) {
        throwBallTo(px, py);
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDraggingPet) return;
      const rect = canvas.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;
      if (isHitMousse(px, py)) petMousseAt(px, py);
    });

    window.addEventListener('pointerup', () => { isDraggingPet = false; });

    /**
     * ============================================================================
     * G. SIMULATION LOOP
     * ============================================================================
     */
    function updateSimulation(dt) {
      mousse.time += dt;
      mousse.tailPhase += dt * (mousse.mode === 'karaoke' ? 5.2 : 2.6);

      mousse.blinkTimer -= dt;
      if (mousse.blinkTimer <= 0) {
        if (!mousse.isBlinking) {
          mousse.isBlinking = true;
          mousse.blinkTimer = 0.15;
        } else {
          mousse.isBlinking = false;
          mousse.blinkTimer = 2.4 + Math.random() * 2.5;
        }
      }

      if (mousse.bubbleTime > 0) {
        mousse.bubbleTime -= dt;
        if (mousse.bubbleTime <= 0 && mousse.mode === 'idle') {
          const idlePhrases = [
            '呼嚕嚕～滑過暮斯可以摸摸頭、看我舉肉球喔 ❤️',
            '點擊木地板任何地方就能丟毛線球 🧶',
            '想聽暮斯唱日文歌嗎？按下面唱日K 🎤',
            '吃飽喝足便意滿了，暮斯會自己去貓砂盆喔 💩'
          ];
          setSpeech(idlePhrases[Math.floor(Math.random() * idlePhrases.length)], 5);
        }
      }

      if (mousse.mode === 'sleeping') {
        state.energy = Math.min(100, state.energy + dt * 4.2);
        state.hunger = Math.max(0, state.hunger - dt * 0.2);
        if (Math.random() < dt * 0.9) {
          spawnFloatingEmoji('💤', mousse.x + 28, mousse.y - 42);
        }
        if (state.energy >= 100) {
          mousse.mode = 'idle';
          mousse.happyEyes = 0;
          setSpeech('充飽電啦！暮斯精神百倍醒來了！⚡', 3);
        }
      } else if (mousse.mode !== 'away') {
        state.hunger = Math.max(0, state.hunger - dt * 0.42);
        state.hydration = Math.max(0, state.hydration - dt * 0.35);
        state.energy = Math.max(10, state.energy - dt * 0.32);
        if (state.poopCount > 0) {
          state.mood = Math.max(25, state.mood - dt * 0.3 * state.poopCount);
        }
      }

      if ((mousse.mode === 'idle' || mousse.mode === 'cheer') && state.bladder >= 75) {
        triggerLitterVisit();
      }

      if (mousse.mode === 'cheer') {
        mousse.timer -= dt;
        if (mousse.timer <= 0) {
          mousse.mode = 'idle';
          mousse.happyEyes = 0;
        }
      }

      if (mousse.mode === 'going_eat') {
        if (moveMousseTowards(mousse.targetX, mousse.targetY, 250, dt)) {
          mousse.facing = -1;
          mousse.mode = 'eating';
          mousse.timer = 3.2;
          mousse.tick = 0;
        }
      }

      if (mousse.mode === 'eating') {
        mousse.timer -= dt;
        mousse.tick += dt;
        state.bowlFood = Math.max(0, mousse.timer / 3.2);
        if (mousse.tick >= 0.46) {
          mousse.tick = 0;
          playCrunch(false);
        }
        if (mousse.timer <= 0) {
          const t = state.bowlType;
          state.bowlType = null;
          state.bowlFood = 0;
          if (t === 'wet') {
            state.hunger = Math.min(100, state.hunger + 40);
            state.hydration = Math.min(100, state.hydration + 24);
            state.bladder = Math.min(100, state.bladder + 40);
            state.mood = Math.min(100, state.mood + 12);
            setSpeech('假日主食餐包太好吃啦喵～幸福舉肉球！❤️', 3.2);
          } else if (t === 'kibble20') {
            state.hunger = Math.min(100, state.hunger + 32);
            state.bladder = Math.min(100, state.bladder + 35);
            state.mood = Math.min(100, state.mood + 7);
            setSpeech('20g 乾飼料全部吃光光！', 3);
          } else {
            state.hunger = Math.min(100, state.hunger + 18);
            state.bladder = Math.min(100, state.bladder + 22);
            state.mood = Math.min(100, state.mood + 5);
            setSpeech('香脆乾乾真美味～喵！', 3);
          }
          saveData();

          if (state.fountainWater > 0.15 && (state.hydration < 85 || t !== 'wet') && state.bladder < 75) {
            const props = getPropsCoords();
            mousse.mode = 'going_drink';
            mousse.targetX = props.water.x + 52;
            mousse.targetY = props.water.y + 4;
          } else {
            mousse.mode = 'cheer';
            mousse.timer = 1.8;
          }
        }
      }

      if (mousse.mode === 'going_drink') {
        if (moveMousseTowards(mousse.targetX, mousse.targetY, 225, dt)) {
          mousse.facing = -1;
          mousse.mode = 'drinking';
          mousse.timer = 2.4;
          mousse.tick = 0;
        }
      }

      if (mousse.mode === 'drinking') {
        mousse.timer -= dt;
        mousse.tick += dt;
        state.fountainWater = Math.max(0.1, state.fountainWater - dt * 0.06);
        if (mousse.tick >= 0.4) {
          mousse.tick = 0;
          playCrunch(true);
        }
        if (mousse.timer <= 0) {
          state.hydration = Math.min(100, state.hydration + 25);
          state.bladder = Math.min(100, state.bladder + 25);
          saveData();
          if (state.bladder >= 75) {
            triggerLitterVisit();
          } else {
            mousse.mode = 'idle';
            setSpeech('喝完水嘴角濕濕的～舔舔嘴巴喵 💧', 3);
          }
        }
      }

      if (mousse.mode === 'going_litter') {
        if (moveMousseTowards(mousse.targetX, mousse.targetY, 240, dt)) {
          mousse.y -= 12;
          mousse.facing = -1;
          mousse.mode = 'squatting';
          mousse.timer = 2.6;
          setSpeech('暮斯正在貓砂盆裡專心上廁所…（請勿打擾🙈）', 2.6);
        }
      }

      if (mousse.mode === 'squatting') {
        mousse.timer -= dt;
        if (mousse.timer <= 0) {
          mousse.mode = 'digging';
          mousse.timer = 1.6;
          mousse.tick = 0;
          state.bladder = 0;
          state.poopCount = Math.min(4, state.poopCount + 1);
          setSpeech('沙沙沙～乖乖撥豆腐砂把便便蓋起來！', 2);
        }
      }

      if (mousse.mode === 'digging') {
        mousse.timer -= dt;
        mousse.tick += dt;
        if (mousse.tick >= 0.34) {
          mousse.tick = 0;
          playDigNoise();
        }
        if (mousse.timer <= 0) {
          mousse.x = stageW * 0.54;
          mousse.y = getFloorLineY() + 46;
          mousse.mode = 'idle';
          playMeow(550, 0.25, 0.12);
          saveData();
          setSpeech('上完廁所好輕鬆喵！記得點貓砂盆或按鏟屎喔 🧹💩', 4.5);
        }
      }

      if (karaoke.active && mousse.mode === 'karaoke') {
        moveMousseTowards(mousse.targetX, mousse.targetY, 200, dt);
        karaoke.noteTimer += dt;
        if (karaoke.noteTimer >= 0.52) {
          karaoke.noteTimer = 0;
          const song = KARAOKE_SONGS[karaoke.songIdx];
          const freq = song.notes[karaoke.noteIdx % song.notes.length];
          karaoke.noteIdx++;
          playMeow(freq, 0.36, 0.1);
          spawnFloatingEmoji(Math.random() > 0.5 ? '🎵' : '🎶', mousse.x + (Math.random() - 0.5) * 70, mousse.y - 115);
          state.mood = Math.min(100, state.mood + 0.8);
        }
        karaoke.lineTimer += dt;
        if (karaoke.lineTimer >= 3.4) {
          karaoke.lineTimer = 0;
          karaoke.lineIdx++;
          updateKaraokeCard();
        }
      }

      if (ball.active) {
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        ball.z += ball.vz * dt;
        ball.vz -= 780 * dt;
        ball.spin += (ball.vx * 0.04) * dt;

        if (ball.z <= 0) {
          ball.z = 0;
          if (Math.abs(ball.vz) > 45) {
            playBounce(Math.min(1, Math.abs(ball.vz) / 260));
            ball.vz = -ball.vz * 0.52;
            ball.vx *= 0.72;
            ball.vy *= 0.72;
          } else {
            ball.vz = 0;
            ball.vx *= Math.pow(0.06, dt);
            ball.vy *= Math.pow(0.06, dt);
          }
        }

        const minY = getFloorLineY() + 26;
        const maxY = stageH - 36;
        if (ball.x < 40) { ball.x = 40; ball.vx = Math.abs(ball.vx) * 0.7; }
        if (ball.x > stageW - 40) { ball.x = stageW - 40; ball.vx = -Math.abs(ball.vx) * 0.7; }
        if (ball.y < minY) { ball.y = minY; ball.vy = Math.abs(ball.vy) * 0.7; }
        if (ball.y > maxY) { ball.y = maxY; ball.vy = -Math.abs(ball.vy) * 0.7; }

        if (mousse.mode === 'chasing') {
          if (moveMousseTowards(ball.x, ball.y, 330, dt)) {
            ball.active = false;
            mousse.carryingBall = true;
            mousse.mode = 'returning_ball';
            mousse.targetX = stageW * 0.5;
            mousse.targetY = getFloorLineY() + 56;
            playMeow(610, 0.22, 0.12);
            setSpeech('叼到毛線球啦！小跑送回來給你～🧶', 2.5);
          }
        }
      }

      if (mousse.mode === 'returning_ball') {
        if (moveMousseTowards(mousse.targetX, mousse.targetY, 270, dt)) {
          mousse.carryingBall = false;
          mousse.mode = 'cheer';
          mousse.timer = 2.2;
          state.mood = Math.min(100, state.mood + 8);
          state.energy = Math.max(10, state.energy - 5);
          playPurr(0.85);
          spawnFloatingEmoji('❤️', mousse.x - 18, mousse.y - 110);
          spawnFloatingEmoji('❤️', mousse.x + 18, mousse.y - 120);
          saveData();
          setSpeech('呼嚕嚕～球球送回來了，開心舉雙手！❤️', 3.4);
        }
      }

      if (mousse.mode === 'walking_out') {
        if (moveMousseTowards(mousse.targetX, mousse.targetY, 230, dt)) {
          mousse.mode = 'away';
          walkAdventure.remaining = 8;
          walkAdventure.timerAccum = 0;
          document.getElementById('walk-countdown').textContent = '8';
          document.getElementById('walk-banner').classList.remove('hidden');
          document.getElementById('speech-bubble').style.opacity = '0';
        }
      }

      if (mousse.mode === 'away') {
        walkAdventure.timerAccum += dt;
        if (walkAdventure.timerAccum >= 1) {
          walkAdventure.timerAccum -= 1;
          walkAdventure.remaining--;
          document.getElementById('walk-countdown').textContent = String(Math.max(0, walkAdventure.remaining));
          if (walkAdventure.remaining <= 0) completeWalkReturn();
        }
      }

      if (mousse.mode === 'returning_gift') {
        if (moveMousseTowards(mousse.targetX, mousse.targetY, 240, dt)) {
          const gift = mousse.carryingGift;
          mousse.carryingGift = null;
          mousse.mode = 'cheer';
          mousse.timer = 2.8;
          playChime();
          spawnFloatingEmoji(gift ? gift.icon : '🎁', mousse.x, mousse.y - 120);
          setSpeech(`散步回來啦！暮斯帶了「${gift ? gift.name : '小禮物'}」送給你！🎁`, 4.5);
        }
      }

      const bubbleEl = document.getElementById('speech-bubble');
      const headOffset = spritesReady
        ? currentSpriteInfo().h + 4
        : (mousse.mode === 'sleeping' ? 68 : 138);
      const bx = Math.min(stageW - 110, Math.max(110, mousse.x));
      const by = Math.max(46, mousse.y - headOffset);
      bubbleEl.style.left = `${bx}px`;
      bubbleEl.style.top = `${by}px`;

      refreshHudUI();
    }

    function moveMousseTowards(tx, ty, speed, dt) {
      const dx = tx - mousse.x;
      const dy = ty - mousse.y;
      const dist = Math.hypot(dx, dy);
      if (Math.abs(dx) > 3) mousse.facing = dx > 0 ? 1 : -1;
      if (dist <= 8) {
        mousse.x = tx;
        mousse.y = ty;
        return true;
      }
      mousse.x += (dx / dist) * speed * dt;
      mousse.y += (dy / dist) * (speed * 0.65) * dt;
      mousse.walkPhase += dt * 13;
      return false;
    }

    /**
     * ============================================================================
     * H. CRISP PIXEL-ART SPRITE RENDERER (MATCHING ALL 6 REFERENCE POSES!)
     * ============================================================================
     */
    const PX = 3.5; // Pixel block size for retro crisp pixel-art look

    // Helper: draw a pixel-aligned rectangle relative to local sprite origin
    function pxRect(gx, gy, gw, gh, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(gx * PX), Math.round(gy * PX), Math.round(gw * PX), Math.round(gh * PX));
    }

    // Helper: draw a fluffy pixel blob with dark pixel outline & golden shading
    function drawPixelFluff(cx, cy, rx, ry, seed = 0) {
      const x0 = Math.floor(cx - rx - 1);
      const x1 = Math.ceil(cx + rx + 1);
      const y0 = Math.floor(cy - ry - 1);
      const y1 = Math.ceil(cy + ry + 1);

      for (let py = y0; py <= y1; py++) {
        for (let px = x0; px <= x1; px++) {
          const nx = (px - cx) / rx;
          const ny = (py - cy) / ry;
          const angle = Math.atan2(ny, nx);
          const furWave = Math.sin(angle * 9 + seed) * 0.08 + Math.cos(angle * 15 - seed) * 0.05;
          const d = Math.hypot(nx, ny) - furWave;

          if (d <= 1.08) {
            let col = '#e69f45'; // Warm golden-ginger base
            if (d > 0.94) {
              col = '#381e10'; // Crisp dark pixel-art outline
            } else if (ny < -0.45 && Math.abs(nx) < 0.45 && (px + py) % 3 === 0) {
              col = '#b86822'; // Tabby forehead/back stripes
            } else if (ny > 0.35 && Math.abs(nx) < 0.65) {
              col = '#fff5e4'; // Creamy white chest/chin fur
            } else if (ny < -0.25) {
              col = '#f6c26b'; // Sunlit golden highlight
            } else if (Math.abs(nx) > 0.68) {
              col = '#c97a2c'; // Shaded side fur
            }
            pxRect(px, py, 1, 1, col);
          }
        }
      }
    }

    // Helper: draw big fluffy plume tail with dark tip (matching walk1, walk2, sleep1, sleep2)
    function drawPixelPlumeTail(tx, ty, angleRad, length = 14, thickness = 5) {
      ctx.save();
      ctx.translate(Math.round(tx * PX), Math.round(ty * PX));
      ctx.rotate(angleRad);
      for (let i = 0; i <= length; i++) {
        const t = i / length;
        const r = Math.max(2, Math.round(thickness * Math.sin(t * Math.PI * 0.82 + 0.25)));
        const wy = Math.round(Math.sin(t * 4) * 1.2);
        for (let dy = -r - 1; dy <= r + 1; dy++) {
          const dist = Math.abs(dy);
          if (dist <= r + 1) {
            let col = '#e69f45';
            if (dist === r + 1 || i === length) col = '#381e10'; // Pixel outline
            else if (t > 0.72) col = '#5c4332'; // Signature dark tail tip
            else if (t > 0.55) col = '#fae3be'; // Cream gradient band
            else if (dy < 0) col = '#f7c772';
            pxRect(i, wy + dy, 1, 1, col);
          }
        }
      }
      ctx.restore();
    }

    // Helper: draw pixel cat head (big round dark eyes, folded/perky ears, pink nose, white whiskers)
    function drawPixelHead(hx, hy, opts = {}) {
      const { winkLeft = false, closedEyes = false, openSmile = false, foldedEars = false } = opts;

      // Left & Right Ears
      if (foldedEars) {
        // Cute folded ears (like sleep1.jpg)
        pxRect(hx - 11, hy - 7, 5, 3, '#381e10');
        pxRect(hx - 10, hy - 6, 4, 2, '#d48234');
        pxRect(hx - 9, hy - 5, 2, 1, '#fff3e0');

        pxRect(hx + 6, hy - 7, 5, 3, '#381e10');
        pxRect(hx + 6, hy - 6, 4, 2, '#d48234');
        pxRect(hx + 7, hy - 5, 2, 1, '#fff3e0');
      } else {
        // Perky British Longhair ears
        for (let row = 0; row < 5; row++) {
          const w = 5 - row;
          pxRect(hx - 9 + Math.floor(row / 2), hy - 8 - row, w, 1, row === 4 ? '#381e10' : '#d48234');
          pxRect(hx + 9 - w - Math.floor(row / 2), hy - 8 - row, w, 1, row === 4 ? '#381e10' : '#d48234');
        }
        pxRect(hx - 8, hy - 10, 2, 2, '#f9a8b8');
        pxRect(hx + 6, hy - 10, 2, 2, '#f9a8b8');
      }

      // Main Fluffy Head
      drawPixelFluff(hx, hy, 10, 8.5, 1.4);

      // Forehead M-tabby stripes
      pxRect(hx - 2, hy - 7, 1, 3, '#a85a1c');
      pxRect(hx, hy - 6, 1, 3, '#a85a1c');
      pxRect(hx + 2, hy - 7, 1, 3, '#a85a1c');

      // Cream cheeks & muzzle
      pxRect(hx - 6, hy + 2, 12, 5, '#fff6e8');
      pxRect(hx - 4, hy + 6, 8, 2, '#fff6e8');

      // Eyes
      if (closedEyes) {
        // Happy curved closed eyes (cheer.jpg / sleep1.jpg / sleep2.jpg)
        pxRect(hx - 6, hy, 4, 1, '#2b160b');
        pxRect(hx - 7, hy + 1, 1, 1, '#2b160b');
        pxRect(hx - 2, hy + 1, 1, 1, '#2b160b');

        pxRect(hx + 2, hy, 4, 1, '#2b160b');
        pxRect(hx + 1, hy + 1, 1, 1, '#2b160b');
        pxRect(hx + 6, hy + 1, 1, 1, '#2b160b');
      } else {
        // Left eye (can wink like stand.jpg!)
        if (winkLeft) {
          pxRect(hx - 6, hy, 4, 1, '#2b160b');
          pxRect(hx - 7, hy - 1, 1, 1, '#2b160b');
        } else {
          pxRect(hx - 6, hy - 2, 4, 4, '#141a12');
          pxRect(hx - 6, hy - 2, 1, 1, '#ffffff'); // Pixel shine
          pxRect(hx - 3, hy + 1, 1, 1, '#658238'); // Green-gold rim
        }
        // Right big round dark eye
        pxRect(hx + 2, hy - 2, 4, 4, '#141a12');
        pxRect(hx + 2, hy - 2, 1, 1, '#ffffff'); // Pixel shine
        pxRect(hx + 5, hy + 1, 1, 1, '#658238');
      }

      // Pink Nose
      pxRect(hx - 1, hy + 2, 2, 2, '#f4728c');

      // Mouth
      if (openSmile) {
        // Big happy open mouth with pink tongue (cheer.jpg!)
        pxRect(hx - 3, hy + 4, 6, 1, '#381e10');
        pxRect(hx - 2, hy + 5, 4, 3, '#e11d48');
        pxRect(hx - 1, hy + 6, 2, 2, '#fb7185');
      } else {
        pxRect(hx - 3, hy + 4, 2, 1, '#5c3419');
        pxRect(hx + 1, hy + 4, 2, 1, '#5c3419');
        pxRect(hx - 1, hy + 5, 2, 1, '#5c3419');
      }

      // White Pixel Whiskers
      pxRect(hx - 12, hy + 2, 4, 1, '#ffffff');
      pxRect(hx - 11, hy + 4, 3, 1, '#ffffff');
      pxRect(hx + 8, hy + 2, 4, 1, '#ffffff');
      pxRect(hx + 8, hy + 4, 3, 1, '#ffffff');
    }

    function drawPixelPaw(px, py, showToeBeans = false) {
      pxRect(px - 2, py - 2, 4, 4, '#381e10');
      pxRect(px - 1, py - 1, 3, 3, '#fff6e8');
      if (showToeBeans) {
        // Cute brown-pink toe beans (cheer.jpg!)
        pxRect(px - 1, py - 1, 1, 1, '#6b3e26');
        pxRect(px + 1, py - 1, 1, 1, '#6b3e26');
        pxRect(px, py, 2, 1, '#6b3e26');
      }
    }

    function drawPixelHeart(hx, hy) {
      const c = '#ef4444';
      const hi = '#fca5a5';
      pxRect(hx - 2, hy - 1, 2, 2, c);
      pxRect(hx + 1, hy - 1, 2, 2, c);
      pxRect(hx - 2, hy + 1, 5, 1, c);
      pxRect(hx - 1, hy + 2, 3, 1, c);
      pxRect(hx, hy + 3, 1, 1, c);
      pxRect(hx - 2, hy - 1, 1, 1, hi);
    }

    function renderScene() {
      ctx.clearRect(0, 0, stageW, stageH);
      const fy = getFloorLineY();

      // 1. Cozy Pixel Wall
      ctx.fillStyle = '#fdf4e3';
      ctx.fillRect(0, 0, stageW, fy);
      ctx.fillStyle = '#e5be91';
      ctx.fillRect(0, fy - 12, stageW, 12);
      ctx.fillStyle = '#4a2c18';
      ctx.fillRect(0, fy - 2, stageW, 3);

      // 2. Pixel Sunny Window
      const winX = Math.max(20, stageW * 0.08);
      const winY = Math.max(14, fy * 0.14);
      const winW = Math.min(126, stageW * 0.22);
      const winH = Math.min(120, fy * 0.56);
      ctx.fillStyle = '#bae6fd';
      ctx.fillRect(winX, winY, winW, winH);
      ctx.strokeStyle = '#4a2c18';
      ctx.lineWidth = 4;
      ctx.strokeRect(winX, winY, winW, winH);
      ctx.fillStyle = '#4a2c18';
      ctx.fillRect(winX + winW / 2 - 2, winY, 4, winH);
      ctx.fillRect(winX, winY + winH * 0.55, winW, 4);

      // 3. Pixel Wooden Floorboards
      ctx.fillStyle = '#dda364';
      ctx.fillRect(0, fy, stageW, stageH - fy);
      ctx.fillStyle = '#b97a3d';
      for (let py = fy + 26; py < stageH; py += 26) {
        ctx.fillRect(0, py, stageW, 3);
      }

      // Soft Oval Pixel Rug
      const rugX = stageW * 0.5;
      const rugY = fy + 48;
      ctx.fillStyle = '#fff8ec';
      ctx.beginPath();
      ctx.ellipse(rugX, rugY, Math.min(205, stageW * 0.33), 44, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#c88a4b';
      ctx.lineWidth = 4;
      ctx.stroke();

      // 4. Karaoke Stage Spotlight & Pixel Stand Mic
      if (karaoke.active) {
        ctx.save();
        ctx.fillStyle = 'rgba(253, 224, 71, 0.26)';
        ctx.beginPath();
        ctx.arc(stageW * 0.5, fy + 20, 175, 0, Math.PI * 2);
        ctx.fill();

        const micX = mousse.x + (spritesReady ? currentSpriteInfo().w * 0.5 + 16 : 58);
        const micY = mousse.y + 8;
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(micX - 14, micY - 4, 28, 6);
        ctx.fillRect(micX - 2, micY - 76, 4, 74);
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(micX - 10, micY - 82, 12, 10);
        ctx.restore();
      }

      // 5. Pixel Care Props
      drawPixelProps();

      // 6. Pixel Mousse Sprite (All 6 Poses!)
      drawPixelMousse();

      // 7. Pixel Yarn Ball
      if (ball.active) {
        drawPixelYarnBall(ball.x, ball.y - ball.z, ball.z, ball.spin);
      }
    }

    function drawPixelProps() {
      const props = getPropsCoords();

      // Water Fountain
      ctx.save();
      ctx.translate(props.water.x, props.water.y);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-22, -22, 44, 28);
      ctx.strokeStyle = '#4a2c18';
      ctx.lineWidth = 3;
      ctx.strokeRect(-22, -22, 44, 28);
      ctx.fillStyle = state.fountainWater > 0.2 ? '#38bdf8' : '#cbd5e1';
      ctx.fillRect(-18, -20, 36, 7);
      ctx.fillRect(-4, -29, 8, 9);
      ctx.restore();

      // Orange Food Bowl
      ctx.save();
      ctx.translate(props.food.x, props.food.y);
      ctx.fillStyle = '#f97316';
      ctx.fillRect(-22, -6, 44, 15);
      ctx.strokeStyle = '#4a2c18';
      ctx.lineWidth = 3;
      ctx.strokeRect(-22, -6, 44, 15);
      if (state.bowlFood > 0.05) {
        ctx.fillStyle = state.bowlType === 'wet' ? '#9a3412' : '#78350f';
        const fw = Math.max(8, Math.round(34 * state.bowlFood));
        ctx.fillRect(-fw / 2, -11, fw, 5);
      }
      ctx.restore();

      // Tofu Litter Box
      ctx.save();
      ctx.translate(props.litter.x, props.litter.y);
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(-46, -28, 92, 40);
      ctx.strokeStyle = '#4a2c18';
      ctx.lineWidth = 3;
      ctx.strokeRect(-46, -28, 92, 40);
      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(-42, -6, 84, 14);
      if (state.poopCount > 0) {
        ctx.fillStyle = '#78350f';
        for (let i = 0; i < state.poopCount; i++) {
          ctx.fillRect(-24 + i * 14, -8, 9, 7);
        }
      }
      ctx.restore();
    }

    /**
     * ============================================================================
     * H2. IMAGE SPRITES (pixel-art PNGs in the same folder as this file)
     * ============================================================================
     * All sprites face RIGHT. crop = non-transparent bounding box [x, y, w, h].
     * h = display height relative to the base cat size.
     */
    const SPRITE_PATH = ''; // e.g. 'img/' if you move the PNGs into a folder
    const SPRITES = {
      stand:  { file: 'stand.png',  crop: [14, 18, 402, 554], h: 1.00 },
      walk1:  { file: 'walk1.png',  crop: [7, 10, 474, 498],  h: 0.92 },
      walk2:  { file: 'walk2.png',  crop: [0, 11, 568, 424],  h: 0.80 },
      cheer:  { file: 'cheer.png',  crop: [0, 21, 391, 589],  h: 1.28 },
      sleep1: { file: 'sleep1.png', crop: [30, 25, 691, 313], h: 0.58 },
      sleep2: { file: 'sleep2.png', crop: [7, 8, 506, 465],   h: 0.98 }
    };
    let spritesReady = false;

    function loadSprites() {
      const keys = Object.keys(SPRITES);
      let loaded = 0, failed = false;
      keys.forEach(k => {
        const img = new Image();
        img.onload = () => {
          loaded++;
          if (loaded === keys.length && !failed) spritesReady = true;
        };
        img.onerror = () => { failed = true; }; // falls back to drawn cat
        img.src = SPRITE_PATH + SPRITES[k].file;
        SPRITES[k].img = img;
      });
    }
    loadSprites();

    // Base cat height on screen (scales with room size)
    function catBaseH() {
      return Math.max(96, Math.min(160, stageH * 0.27));
    }

    // Current sprite key + on-screen height, used by drawing, hit test & bubble
    function currentSpriteInfo() {
      const m = mousse.mode;
      let key = 'stand';
      if (m === 'sleeping') key = mousse.sleepStyle === 1 ? 'sleep1' : 'sleep2';
      else if (m === 'cheer' || m === 'karaoke') key = 'cheer';
      else if (['going_eat', 'going_drink', 'going_litter', 'chasing', 'returning_ball', 'walking_out', 'returning_gift'].includes(m)) {
        key = Math.floor(mousse.walkPhase / Math.PI) % 2 === 0 ? 'walk1' : 'walk2';
      } else if (m === 'eating' || m === 'drinking') key = 'walk2';
      else if (m === 'digging') key = Math.floor(mousse.time * 7) % 2 === 0 ? 'walk1' : 'walk2';
      const s = SPRITES[key];
      const h = catBaseH() * s.h;
      const w = h * (s.crop[2] / s.crop[3]);
      return { key, s, w, h };
    }

    function drawSpriteMousse() {
      const { key, s, w, h } = currentSpriteInfo();
      const m = mousse.mode;
      const footY = 12; // sprite bottom sits on the shadow

      ctx.save();
      ctx.translate(Math.round(mousse.x), Math.round(mousse.y));

      // Ground shadow
      ctx.fillStyle = 'rgba(74, 44, 24, 0.22)';
      ctx.beginPath();
      ctx.ellipse(0, footY - 2, w * 0.42, Math.max(8, h * 0.07), 0, 0, Math.PI * 2);
      ctx.fill();

      // Motion: bob / hop / breathe
      let dy = 0, sx = 1, sy = 1;
      if (key === 'walk1' || key === 'walk2') {
        if (m === 'eating' || m === 'drinking') dy = Math.sin(mousse.time * 14) * 1.5;
        else dy = -Math.abs(Math.sin(mousse.walkPhase)) * 4;
      } else if (key === 'cheer') {
        dy = -Math.abs(Math.sin(mousse.time * 6)) * 7;
      } else if (key === 'stand') {
        sy = 1 + Math.sin(mousse.time * 2.4) * 0.012;
      } else {
        const b = Math.sin(mousse.time * 2.2);
        sy = 1 + b * 0.025;
        sx = 1 - b * 0.008;
      }

      // Sprites face right; flip when moving left (not for front-facing poses)
      const flip = (key === 'walk1' || key === 'walk2') && mousse.facing < 0 ? -1 : 1;

      ctx.translate(0, footY + dy);
      ctx.scale(flip * sx, sy);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      const c = s.crop;
      ctx.drawImage(s.img, c[0], c[1], c[2], c[3], Math.round(-w / 2), Math.round(-h), Math.round(w), Math.round(h));
      ctx.imageSmoothingEnabled = false;

      // Carried items near the mouth (sprite faces right before flip)
      if (mousse.carryingBall) {
        ctx.save();
        ctx.scale(flip, 1); // keep ball unflipped
        drawPixelYarnBall(flip * w * 0.42, -h * 0.42, 0, 0, Math.max(0.6, h / 170));
        ctx.restore();
      } else if (mousse.carryingGift) {
        ctx.save();
        ctx.scale(flip, 1);
        ctx.font = Math.round(h * 0.2) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(mousse.carryingGift.icon, flip * w * 0.44, -h * 0.4);
        ctx.restore();
      }
      ctx.restore();
    }

    function drawPixelMousse() {
      if (mousse.mode === 'away') return;
      if (spritesReady) { drawSpriteMousse(); return; }
      drawProceduralMousse();
    }

    // Fallback: original code-drawn cat (used only if PNGs fail to load)
    function drawProceduralMousse() {

      ctx.save();
      ctx.translate(Math.round(mousse.x), Math.round(mousse.y));

      // Ground pixel shadow
      ctx.fillStyle = 'rgba(74, 44, 24, 0.25)';
      ctx.beginPath();
      ctx.ellipse(0, 12, mousse.mode === 'sleeping' ? 76 : 48, 11, 0, 0, Math.PI * 2);
      ctx.fill();

      // POSE A: SLEEPING (sleep1.jpg Sploot OR sleep2.jpg Cinnamon Roll)
      if (mousse.mode === 'sleeping') {
        const breath = Math.sin(mousse.time * 2.2) * 0.6;
        if (mousse.sleepStyle === 1) {
          // sleep1.jpg: Flattened "melted butter" sploot on wooden floor
          drawPixelPlumeTail(-12, -1, -2.9 + Math.sin(mousse.time * 1.5) * 0.08, 12, 4.5);
          drawPixelFluff(-3, -4 - breath, 12, 6.5 + breath, 2.1);
          drawPixelPaw(-9, 1);
          drawPixelPaw(4, 2);
          drawPixelPaw(15, 2);
          drawPixelHead(10, -3 - breath, { closedEyes: true, foldedEars: true });
        } else {
          // sleep2.jpg: Curled up round cinnamon-roll ball wrapped in fluffy tail
          drawPixelFluff(0, -6 - breath, 13, 10 + breath, 3.3);
          drawPixelHead(4, -6 - breath, { closedEyes: true, foldedEars: false });
          drawPixelPlumeTail(-11, -1, -0.1, 22, 4.5);
        }
        ctx.restore();
        return;
      }

      // POSE B: CHEER / KARAOKE (cheer.jpg: Standing upright with both front paws raised showing toe beans & floating pixel hearts!)
      if (mousse.mode === 'cheer' || mousse.mode === 'karaoke') {
        const hop = Math.abs(Math.sin(mousse.time * 6)) * 2.2;
        ctx.translate(0, -Math.round(hop * PX));

        // Tail wagging behind
        drawPixelPlumeTail(-7, -4, -2.1 + Math.sin(mousse.tailPhase) * 0.25, 13, 4.2);

        // Chubby standing fluffy torso with white belly
        drawPixelFluff(0, -10, 9.5, 10, 0.8);

        // Bottom feet
        drawPixelPaw(-5, 1);
        drawPixelPaw(5, 1);

        // Raised front paws showing cute brown toe beans!
        const wave = Math.sin(mousse.time * 8) * 1.2;
        drawPixelPaw(-11, -15 - wave, true);
        drawPixelPaw(11, -15 + wave, true);

        // Happy open-mouth smiling head
        drawPixelHead(0, -24, { closedEyes: true, openSmile: true });

        // Floating red pixel hearts around Mousse (like cheer.jpg)
        const hFloat = Math.sin(mousse.time * 4) * 2;
        drawPixelHeart(-15, -28 + hFloat);
        drawPixelHeart(15, -30 - hFloat);
        drawPixelHeart(-9, -37 - hFloat);
        drawPixelHeart(10, -38 + hFloat);

        ctx.restore();
        return;
      }

      // POSE C: WALKING / CHASING / EATING / DRINKING / SITTING WINK (walk1, walk2, stand)
      const isMoving = ['going_eat', 'going_drink', 'going_litter', 'chasing', 'returning_ball', 'walking_out', 'returning_gift'].includes(mousse.mode);
      const isHeadDown = mousse.mode === 'eating' || mousse.mode === 'drinking';

      ctx.scale(mousse.facing, 1);
      if (isMoving) {
        const bounce = Math.abs(Math.sin(mousse.walkPhase)) * 1.8;
        ctx.translate(0, -Math.round(bounce * PX));
      }

      if (isMoving || isHeadDown) {
        // Side-profile walking / eating body (walk1.jpg & walk2.jpg)
        const tailAngle = mousse.mode === 'chasing' ? -1.3 : -1.8 + Math.sin(mousse.tailPhase) * 0.25;
        drawPixelPlumeTail(-10, -9, tailAngle, 14, 4.5);

        const stride = isMoving ? Math.sin(mousse.walkPhase) * 3 : 0;
        drawPixelPaw(-7 - stride, 1);
        drawPixelPaw(-2 + stride, 1);
        drawPixelFluff(0, -8, 11.5, 7.5, 1.9);
        drawPixelPaw(5 - stride, 1);
        drawPixelPaw(9 + stride, 1);

        const headX = isHeadDown ? 13 : 9;
        const headY = isHeadDown ? -8 + Math.sin(mousse.time * 14) * 1.2 : -16;
        drawPixelHead(headX, headY, { closedEyes: isHeadDown });

        if (mousse.carryingBall) {
          drawPixelYarnBall(18 * PX, -3 * PX, 0, 0, 0.72);
        } else if (mousse.carryingGift) {
          ctx.font = '22px sans-serif';
          ctx.fillText(mousse.carryingGift.icon, 14 * PX, -2 * PX);
        }
      } else {
        // Cute sitting wink pose (stand.jpg!)
        drawPixelPlumeTail(-8, -3, -2.5 + Math.sin(mousse.tailPhase) * 0.2, 13, 4.5);
        drawPixelFluff(0, -10, 9.5, 9.5, 0.5);
        drawPixelPaw(-5, 1);
        drawPixelPaw(5, 1);
        // Front paws tucked cutely on chest
        drawPixelPaw(-3, -9);
        drawPixelPaw(4, -9);

        const wink = mousse.happyEyes > 0.5 || mousse.isBlinking || Math.sin(mousse.time * 0.9) > 0.72;
        drawPixelHead(0, -23, { winkLeft: wink });
      }

      ctx.restore();
    }

    function drawPixelYarnBall(bx, by, zHeight, spinAngle, scale = 1) {
      ctx.save();
      if (zHeight > 0) {
        ctx.fillStyle = 'rgba(74, 44, 24, 0.22)';
        ctx.beginPath();
        ctx.ellipse(bx, by + zHeight + 10, 14 * scale, 5 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.translate(bx, by);
      ctx.scale(scale, scale);
      ctx.rotate(spinAngle);

      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(-12, -12, 24, 24);
      ctx.strokeStyle = '#4a2c18';
      ctx.lineWidth = 3;
      ctx.strokeRect(-12, -12, 24, 24);
      ctx.fillStyle = '#fecdd3';
      ctx.fillRect(-8, -6, 14, 3);
      ctx.fillRect(-6, 2, 12, 3);
      ctx.restore();
    }

    /**
     * ============================================================================
     * I. MAIN ENTRYPOINT
     * ============================================================================
     */
    let lastFrameTime = performance.now();

    function mainLoop(now) {
      const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
      lastFrameTime = now;
      updateSimulation(dt);
      renderScene();
      requestAnimationFrame(mainLoop);
    }

    window.onload = function () {
      loadSavedData();
      resizeStage();
      mousse.x = stageW * 0.5;
      mousse.y = getFloorLineY() + 46;
      refreshHudUI();
      requestAnimationFrame(mainLoop);
    };
  </script>
</body>
</html>
